name: Checks
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y acl attr xvfb libgbm1 libasound2t64
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run build
      - if: runner.os == 'Windows'
        run: npm test
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
