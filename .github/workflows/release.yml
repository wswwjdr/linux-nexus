name: Publish Windows release

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Validate release tag and prepare signing configuration
        id: release
        run: node scripts/release.mjs prepare "$env:GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm run test:release
      - name: Build Windows installer
        env:
          INTERNAL_VERSION: ${{ steps.release.outputs.version }}
          DISPLAY_VERSION: ${{ steps.release.outputs.display_version }}
        run: |
          npm version "$env:INTERNAL_VERSION" --no-git-tag-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:win -- "-c.artifactName=Linux-Nexus-Setup-$env:DISPLAY_VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency: windows-stable-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/release.mjs publish "$GITHUB_REF_NAME"
